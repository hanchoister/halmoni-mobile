# Types, lint, and the Sentry scrubbing check on every push and PR.
#
# The scrubbing check is here for a specific reason. It failed the first time it
# was ever run: ids and emails were redacted but a parent's name and a
# medication survived inside an Error message. That class of mistake is silent —
# nothing crashes, events just quietly carry health data to a third party — so
# it needs a machine watching it, not a memory.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Contracts — no table or rpc without a migration
        run: npm run verify:contracts
      - name: Consent — no parent's data without a recorded basis
        run: npm run verify:consent
      - name: Doses — the horizon is refreshed, not minted once
        run: npm run verify:doses
      - name: Logic — dates and PHI scrubbing
        run: npm run verify:logic
      # Again, from the other side of the world. The dose planner used to
      # materialise wall-clock times in whatever zone the machine was in, so a
      # suite that only ever ran in one zone could not see the bug (G2-27) —
      # and a runner is always UTC, which is exactly the zone that hides it.
      # Tokyo is chosen because it is a whole day ahead for part of the day.
      - name: Logic — again, in a far-away timezone
        env:
          TZ: Asia/Tokyo
        run: npm run verify:logic
      - name: Sentry scrubbing must not leak PHI
        run: npm run verify:scrub
